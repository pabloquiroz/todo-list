<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
    <h2 class="text-2xl font-semibold mb-4 text-center">📝 Todo List</h2>
  
    <div class="flex gap-2 mb-4">
      <input
        class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-300"
        [(ngModel)]="newTodo"
        placeholder="Add new task"
      />
      <button
        (click)="addTodo()"
        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md"
      >
        Add
      </button>
    </div>
  
    <ul class="space-y-2">
      @for(todo of todos(); track todo; let idx = $index) {
        <li class="flex justify-between items-center bg-gray-100 px-4 py-2 rounded-md">
            <span>{{ todo }}</span>
            <button
            (click)="removeTodo(idx)"
            class="text-red-500 hover:text-red-700"
            aria-label="Delete"
          >
            ✖
          </button>
        </li>
      }
    </ul>
  </div>
